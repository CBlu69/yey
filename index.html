<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yey</title>

    <link rel="icon" type="image/png" href="assets/logomain.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yey">
    <link rel="apple-touch-icon" href="assets/logomain.png">
</head>

<body>
    <!-- صفحه ورود -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container" id="auth-container">
            <div class="auth-logo">
                <img src="assets/logo.png" alt="logo"
                    style="width:100%;height:100%;object-fit:cover;border-radius:18px;">
            </div>
            <p class="subtitle">اسمت رو وارد کن</p>
            <div class="input-wrapper">
                <input type="text" id="nickname-input" placeholder="اسمت رو بنویس..." autocomplete="off" maxlength="20"
                    autofocus>
            </div>
            <button id="type-login-btn" class="login-btn">ورود</button>
            <div id="login-message" class="login-message"></div>
            <p class="auth-footer">🔒 فقط دوستان مجاز</p>
        </div>
    </div>

    <!-- صفحه اصلی -->
    <div id="main-screen" class="screen">
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chat">
                <span class="icon"><img src="assets/icons/chat.png" alt="چت"></span><span>چت</span>
            </button>
            <button class="nav-item" data-tab="map">
                <span class="icon"><img src="assets/icons/map.png" alt="نقشه"></span><span>نقشه</span>
            </button>
            <button class="nav-item" data-tab="games">
                <span class="icon"><img src="assets/icons/game.png" alt="بازی"></span><span>بازی</span>
            </button>
            <button class="nav-item" data-tab="expenses">
                <span class="icon"><img src="assets/icons/money.png" alt="حساب"></span><span>حساب کتاب</span>
            </button>
            <button class="nav-item" data-tab="memories">
                <span class="icon"><img src="assets/icons/gallery.png" alt="خاطرات"></span><span>خاطرات</span>
            </button>
            <button class="nav-item" data-tab="calendar">
                <span class="icon"><img src="assets/icons/calendar-nav.png" alt="تقویم"></span>
                <span>تقویم</span>
            </button>
        </nav>

        <div class="tab-content">

            <!-- چت -->
            <div id="tab-chat" class="tab-pane active">
                <div class="chat-container">
                    <div class="chat-header">
                        <h2><img src="assets/icons/chat.png" class="header-icon"> گفتگوی گروهی</h2>
                        <div class="header-actions">
                            <button id="search-btn" class="logout-btn" title="جستجو در پیام‌ها"
                                onclick="window.openChatSearch()">🔍</button>
                            <button id="theme-btn" class="logout-btn" title="تم رنگی">🎨</button>
                            <button id="install-btn" class="install-pwa-btn" style="display:none;"
                                onclick="installPWA()">
                                <img src="assets/icons/install.png" style="width:16px;height:16px;object-fit:contain;">
                                نصب
                            </button>
                            <button id="logout-btn" class="logout-btn">
                                <img src="assets/icons/logout.png" style="width:16px;height:16px;object-fit:contain;">
                                خروج
                            </button>
                        </div>
                    </div>
                    <div class="chat-messages-wrapper" id="chat-messages-wrapper">
                        <div id="chat-messages" class="messages"></div>
                        <button class="scroll-to-bottom" id="scroll-to-bottom"
                            onclick="document.getElementById('chat-messages-wrapper').scrollTo({top:document.getElementById('chat-messages-wrapper').scrollHeight,behavior:'smooth'})">⬇</button>
                    </div>
                    <div class="chat-input-fixed">
                        <div id="typing-indicator" class="typing-indicator" style="display:none;">
                            <span class="typing-text"></span>
                            <span class="typing-dots"><span></span><span></span><span></span></span>
                        </div>
                        <div id="reply-preview-container"></div>
                        <form id="chat-form" class="chat-input">
                            <button type="button" id="attach-btn" class="attach-btn" title="افزودن">
                                📎
                            </button>
                            <input type="text" id="message-input" placeholder="پیامت رو بنویس..." autocomplete="off">
                            <button type="button" id="voice-record-btn" class="voice-record-btn"
                                title="نگه دار برای ضبط ویس">
                                <img src="assets/icons/mic.png" alt="ویس"
                                    style="width:20px;height:20px;object-fit:contain;">
                            </button>
                            <button type="submit">
                                <img src="assets/icons/send.png" alt="ارسال"
                                    style="width:20px;height:20px;object-fit:contain;">
                            </button>
                        </form>
                        <input type="file" id="chat-file-input" multiple hidden>
                        <div id="voice-recording-bar" class="voice-recording-bar" style="display:none;">
                            <button type="button" id="voice-cancel-btn" class="voice-cancel-btn"
                                title="لغو ضبط">✕</button>
                            <div class="voice-rec-status">
                                <span class="voice-rec-dot"></span>
                                <span id="voice-timer">0:00</span>
                            </div>
                            <span class="voice-rec-hint">برای ارسال رها کن</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- نقشه -->
            <div id="tab-map" class="tab-pane">
                <h2 class="tab-title"><img src="assets/icons/map.png" class="header-icon"> نقشه دوستان</h2>
                <div id="map-container"></div>
                <div class="map-controls">
                    <button id="share-location-btn" class="map-btn primary-btn">📍 اشتراک موقعیت</button>
                    <button id="add-pin-btn" class="map-btn">📌 پین جدید</button>
                </div>
            </div>

            <!-- بازی -->
            <div id="tab-games" class="tab-pane">
                <h2 class="tab-title"><img src="assets/icons/game.png" class="header-icon"> بازی‌های گروهی</h2>
                <div class="games-grid">
                    <div class="game-card" data-game="bottle">
                        <span class="game-icon">🍾</span>
                        <h3>چرخوندن بطری</h3>
                        <p>بچرخون ببین کی انتخاب میشه!</p>
                    </div>
                    <div class="game-card" data-game="truth-dare">
                        <span class="game-icon">🔥</span>
                        <h3>حقیقت یا جرأت</h3>
                        <p>جرأت می‌کنی حقیقت رو بگی؟</p>
                    </div>
                    <div class="game-card" data-game="spy">
                        <span class="game-icon">🕵️</span>
                        <h3>اسپای</h3>
                        <p>جاسوس رو پیدا کن!</p>
                    </div>
                </div>
            </div>

            <!-- حساب کتاب -->
            <div id="tab-expenses" class="tab-pane">
                <div class="expenses-container">
                    <h2 class="tab-title"><img src="assets/icons/money.png" class="header-icon"> حساب کتاب گروهی</h2>
                    <form id="expense-form" class="expense-form-glass">
                        <div class="form-group full-width">
                            <label class="form-label">📝 بابت چی؟</label>
                            <input type="text" id="expense-desc" placeholder="مثلاً: پیتزای امشب">
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label">💵 مبلغ (تومان)</label>
                            <input type="number" id="expense-amount" placeholder="مثلاً ۲۵۰۰۰۰">
                        </div>
                        <div class="form-group full-width">
                            <label class="form-label">👤 کی پرداخت کرد؟</label>
                            <select id="expense-paid-by">
                                <option value="">👤 کی پرداخت کرد؟</option>
                            </select>
                        </div>
                        <div class="form-group full-width" id="participants-container"></div>
                        <button type="submit" class="submit-expense-btn">➕ ثبت هزینه</button>
                    </form>
                    <div id="balance-summary" class="balance-summary"></div>
                    <h3>📋 لیست هزینه‌ها</h3>
                    <div id="expenses-list"></div>
                    <div id="settlements-list"></div>
                </div>
            </div>

            <!-- خاطرات -->
            <div id="tab-memories" class="tab-pane">
                <div class="memories-container">
                    <div class="memories-header">
                        <h2 class="tab-title"><img src="assets/icons/gallery.png" class="header-icon"> گالری خاطرات</h2>
                        <button id="upload-memory-btn" class="upload-btn">📸 آپلود عکس</button>
                        <input type="file" id="memory-upload" accept="image/*" multiple hidden>
                    </div>
                    <div id="memories-grid" class="memories-grid"></div>
                </div>
            </div>

            <!-- تقویم -->
            <div id="tab-calendar" class="tab-pane">
                <div class="calendar-container">
                    <h2 class="tab-title">
                        <img src="assets/icons/calendar-nav.png" class="header-icon"> تقویم گروهی
                    </h2>
                    <div class="calendar-card">
                        <div class="cal-toolbar">
                            <button class="cal-nav-btn" onclick="window.calNavMonth(-1)" title="ماه قبل">▶</button>
                            <span id="calendar-month-label" class="cal-month-label"></span>
                            <button class="cal-nav-btn" onclick="window.calNavMonth(1)" title="ماه بعد">◀</button>
                        </div>
                        <div id="calendar-grid" class="calendar-grid"></div>
                    </div>
                    <div class="calendar-list-header">
                        <h3>
                            <img src="assets/icons/events-list.png" class="header-icon"> رویدادهای روز
                        </h3> 
                        <button id="add-calendar-event-btn" class="upload-btn">➕ رویداد جدید</button>
                    </div>
                    <div id="calendar-events-list" class="calendar-events-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>

    <script>
        let deferredPrompt = null
        if ('serviceWorker' in navigator) {
            // به‌روزرسانی خودکار: اگر نسخه جدید سرویس‌ورکر نصب شد، صفحه رفرش شود
            let refreshing = false
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return
                refreshing = true
                location.reload()
            })
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('✅ SW')
                    // هر ۱۵ دقیقه بررسی نسخه جدید
                    setInterval(() => { reg.update().catch(() => { }) }, 15 * 60 * 1000)
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing
                        if (!newSW) return
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('🆕 نسخه جدید پیدا شد')
                                newSW.postMessage({ type: 'SKIP_WAITING' })
                            }
                        })
                    })
                }).catch(() => { })
            })
        }
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e
            const b = document.getElementById('install-btn'); if (b) b.style.display = 'block'
        })
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null
            const b = document.getElementById('install-btn'); if (b) b.style.display = 'none'
        })
        window.installPWA = async function () {
            const b = document.getElementById('install-btn')
            if (deferredPrompt) {
                try { await deferredPrompt.prompt(); const r = await deferredPrompt.userChoice; if (r.outcome === 'accepted' && b) b.style.display = 'none'; deferredPrompt = null; return }
                catch (e) { }
            }
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) alert('📲 دکمه Share (مربع با فلش) پایین صفحه رو بزن\nسپس Add to Home Screen')
            else if (/Android/.test(navigator.userAgent)) alert('📲 سه نقطه بالا سمت راست رو بزن\nسپس Install app')
            else alert('📲 روی آیکون Install در نوار آدرس کلیک کن')
        }
    </script>
</body>

</html>
