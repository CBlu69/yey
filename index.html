<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اپ دوستانه ما</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet برای نقشه -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- صفحه احراز هویت -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <h1>👋 به اپ دوستانه خوش اومدی</h1>
            <form id="auth-form">
                <input type="email" id="email" placeholder="ایمیلت رو وارد کن" required>
                <input type="password" id="password" placeholder="رمز عبور" required>
                <button type="submit" id="login-btn">ورود</button>
                <button type="button" id="signup-btn">ثبت نام</button>
            </form>
        </div>
    </div>

    <!-- صفحه اصلی -->
    <div id="main-screen" class="screen">
        <!-- نوار ناوبری پایین -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="chat">
                <span class="icon">💬</span>
                <span>چت</span>
            </button>
            <button class="nav-item" data-tab="map">
                <span class="icon">🗺️</span>
                <span>نقشه</span>
            </button>
            <button class="nav-item" data-tab="games">
                <span class="icon">🎲</span>
                <span>بازی</span>
            </button>
            <button class="nav-item" data-tab="expenses">
                <span class="icon">💰</span>
                <span>حساب کتاب</span>
            </button>
            <button class="nav-item" data-tab="memories">
                <span class="icon">📸</span>
                <span>خاطرات</span>
            </button>
        </nav>

        <!-- محتوای تب‌ها -->
        <div class="tab-content">
            <!-- تب چت -->
            <div id="tab-chat" class="tab-pane active">
                <div class="chat-container">
                    <div class="chat-header">
                        <h2>گفتگوی گروهی</h2>
                        <button id="logout-btn" class="logout-btn">🚪 خروج</button>
                    </div>
                    <div id="chat-messages" class="messages"></div>
                    <form id="chat-form" class="chat-input">
                        <input type="text" id="message-input" placeholder="پیامت رو بنویس...">
                        <button type="submit">📨 ارسال</button>
                    </form>
                </div>
            </div>

            <!-- تب نقشه -->
            <div id="tab-map" class="tab-pane">
                <div id="map-container"></div>
                <div class="map-controls">
                    <button id="share-location-btn">📍 موقعیت منو به اشتراک بذار</button>
                    <button id="add-pin-btn">📌 پین جدید</button>
                </div>
            </div>

            <!-- تب بازی -->
            <div id="tab-games" class="tab-pane">
                <div class="games-grid">
                    <div class="game-card" data-game="mafia">
                        <span>🕵️</span>
                        <h3>مافیا</h3>
                        <p>بازی گروهی مافیا با چت صوتی</p>
                    </div>
                    <div class="game-card" data-game="wordguess">
                        <span>🎨</span>
                        <h3>حدس کلمه</h3>
                        <p>نقاشی بکش، کلمه رو حدس بزن</p>
                    </div>
                    <div class="game-card" data-game="rps">
                        <span>✊✋✌️</span>
                        <h3>سنگ کاغذ قیچی</h3>
                        <p>مسابقه آنلاین با دوستان</p>
                    </div>
                </div>
            </div>

            <!-- تب حساب کتاب -->
            <div id="tab-expenses" class="tab-pane">
                <div class="expenses-container">
                    <form id="expense-form">
                        <input type="text" id="expense-desc" placeholder="بابت چی؟" required>
                        <input type="number" id="expense-amount" placeholder="مبلغ (تومان)" required>
                        <select id="expense-paid-by">
                            <option value="">کی پرداخت کرد؟</option>
                        </select>
                        <button type="submit">➕ اضافه کن</button>
                    </form>
                    <div id="expenses-list"></div>
                    <div id="balance-summary"></div>
                </div>
            </div>

            <!-- تب خاطرات -->
            <div id="tab-memories" class="tab-pane">
                <div class="memories-header">
                    <h2>📸 گالری خاطرات</h2>
                    <input type="file" id="memory-upload" accept="image/*" multiple>
                </div>
                <div id="memories-grid" class="masonry-grid"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
